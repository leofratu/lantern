[package]
name = "lantern"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "Local network inventory, managed gateway controls, and per-app proxy shaping"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
hickory-proto = { version = "0.25", default-features = false, features = ["mdns"] }
roxmltree = "0.21"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
